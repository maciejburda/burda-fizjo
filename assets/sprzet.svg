<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Sprzęt do fizjoterapii: przenośny stół do terapii, wałek, piłka i taśmy">
  <g fill="none" stroke="#0f4c4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- miękkie kształty tła -->
    <circle cx="472" cy="146" r="98" fill="#ffffff" opacity=".45" stroke="none"/>
    <circle cx="142" cy="196" r="58" fill="#c98b5e" opacity=".14" stroke="none"/>
    <ellipse cx="320" cy="566" rx="248" ry="18" fill="#0f4c4a" opacity=".07" stroke="none"/>

    <!-- taśma oporowa przewieszona przez brzeg stołu -->
    <path d="M140 296C112 338 116 388 142 406C168 388 172 338 144 296" stroke="#c98b5e" stroke-width="7"/>

    <!-- wałek pod głowę -->
    <rect x="378" y="258" width="116" height="34" rx="17" fill="#f6ece3"/>

    <!-- stół do terapii -->
    <rect x="128" y="290" width="384" height="48" rx="15" fill="#d9ebe8"/>
    <path d="M186 338l-24 132M222 338l24 132M424 338l-24 132M460 338l24 132"/>
    <path d="M170 420h64M412 420h64"/>
    <path d="M150 470h26M238 470h26M388 470h26M476 470h26"/>

    <!-- wałek do rolowania -->
    <rect x="72" y="482" width="152" height="58" rx="29" fill="#d9ebe8"/>
    <ellipse cx="72" cy="511" rx="16" ry="29" fill="#f1f7f5"/>

    <!-- rolki taśm kinesiotaping -->
    <circle cx="298" cy="518" r="33" fill="#f6ece3"/>
    <circle cx="298" cy="518" r="11" fill="#ffffff"/>
    <circle cx="358" cy="536" r="24" fill="#d9ebe8"/>
    <circle cx="358" cy="536" r="8" fill="#ffffff"/>

    <!-- piłka rehabilitacyjna -->
    <circle cx="538" cy="498" r="58" fill="#c98b5e" fill-opacity=".8"/>
    <path d="M512 452c-14 30-12 60 6 84" stroke="#ffffff" stroke-width="5" opacity=".7"/>
  </g>
</svg>
